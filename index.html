<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#101F38;--ink2:#1D3A63;--paper:#F3F1E9;--line:#D3CCB8;--stamp:#B4432E;--ok:#2E6B52;--white:#FFFDF8;--muted:#6B6555}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'IBM Plex Sans',sans-serif}
.strip{display:flex;justify-content:space-between;padding:10px 24px;background:var(--ink);color:var(--paper);font:12px 'IBM Plex Mono',monospace;letter-spacing:.08em}
main{max-width:900px;margin:0 auto;padding:40px 24px 60px}
h1{font:700 clamp(28px,4vw,40px)/1.1 'Space Grotesk',sans-serif;margin:0 0 10px}
.eyebrow{font:12px 'IBM Plex Mono',monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--stamp);margin:0 0 10px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;background:var(--white);padding:30px;text-align:center;cursor:pointer;margin:22px 0}
.drop.over,.drop:hover{border-color:var(--ink2)}.drop b{display:block;font:600 16px 'Space Grotesk',sans-serif}
#fs{display:block;margin-top:8px;font:12px 'IBM Plex Mono',monospace;color:var(--muted);white-space:pre-line}#fs.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.w{grid-column:1/-1}
label{font:11px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--white);font:14px 'IBM Plex Sans',sans-serif;color:var(--ink)}
h3{font:700 18px 'Space Grotesk',sans-serif;margin:26px 0 4px}h3 small{font:12px 'IBM Plex Mono',monospace;color:var(--muted);font-weight:400}
.tr{display:grid;grid-template-columns:70px 100px 1fr;gap:10px;align-items:center;margin-top:6px}.tr span{font:11px 'IBM Plex Mono',monospace;color:var(--muted)}.tr input{margin:0}
.act{display:flex;gap:10px;margin-top:22px}button{padding:10px 18px;border-radius:8px;border:1px solid var(--ink2);background:var(--white);color:var(--ink2);font:500 13px 'IBM Plex Sans',sans-serif;cursor:pointer}
button.pri{background:var(--ink2);color:var(--paper)}iframe{width:100%;height:80vh;border:1px solid var(--line);border-radius:10px;margin-top:20px;background:#fff}
[hidden]{display:none!important}@media(max-width:640px){.grid{grid-template-columns:1fr}.tr{grid-template-columns:1fr}}
</style></head><body>
<div class="strip"><span>CASE STUDY GENERATOR</span><span>EXCEL &rarr; HTML</span></div>
<main>
<p class="eyebrow">Support Engineering Tool</p>
<h1>Two Excel sheets in. One case study out.</h1>
<p>Select both files together &mdash; the module activation sheet and the service-ticket export. Everything is read in your browser; nothing is uploaded.</p>
<label class="drop" id="drop"><input type="file" id="files" accept=".xlsx,.xls" multiple hidden><b>Click or drop both .xlsx files here</b><span id="fs">Waiting for files&hellip;</span></label>
<section id="ed" hidden>
<div class="grid">
<label>Licence no.<input id="lic"></label><label>School name<input id="school"></label>
<label>City / State<input id="city" placeholder="Ahmedabad, Gujarat"></label><label>Installed on<input id="inst"></label>
<label>Prepared by<input id="prep" value="Vidyalaya Support Team"></label><span></span>
<label class="w">Headline<input id="h1"></label><label class="w">Intro paragraph<textarea id="lede" rows="3"></textarea></label>
</div>
<h3>Ticket titles <small>auto-suggested &mdash; edit any</small></h3><div id="tt"></div>
<div class="act"><button id="pv">Preview</button><button id="dl" class="pri">Download HTML</button></div>
</section>
<iframe id="frame" hidden></iframe>
</main>
<script src="/xlsx.full.min.js"></script>
<script>
const TEMPLATE="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Case File No. __LIC__ — __SCHOOL__ ERP<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --ink:#101F38;\n    --ink-2:#1D3A63;\n    --paper:#F3F1E9;\n    --paper-2:#EAE6D9;\n    --line:#D3CCB8;\n    --stamp:#B4432E;\n    --closed:#2E6B52;\n    --amber:#C08A2E;\n    --muted:#6B6555;\n    --white:#FFFDF8;\n    --mono:'IBM Plex Mono', monospace;\n    --sans:'IBM Plex Sans', sans-serif;\n    --display:'Space Grotesk', sans-serif;\n  }\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{\n    margin:0;\n    background:var(--paper);\n    color:var(--ink);\n    font-family:var(--sans);\n    line-height:1.5;\n    background-image:\n      linear-gradient(var(--paper-2) 1px, transparent 1px);\n    background-size:100% 32px;\n  }\n  a{color:inherit;}\n\n  /* ---------- top ledger strip ---------- */\n  .ledger-strip{\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n    padding:10px 24px;\n    background:var(--ink);\n    color:var(--paper);\n    font-family:var(--mono);\n    font-size:12px;\n    letter-spacing:0.08em;\n    flex-wrap:wrap;\n    gap:6px;\n  }\n  .ledger-strip span{opacity:0.85;}\n\n  /* ---------- hero ---------- */\n  .hero{\n    max-width:1040px;\n    margin:0 auto;\n    padding:56px 24px 40px;\n    display:grid;\n    grid-template-columns:1.3fr 1fr;\n    gap:40px;\n    align-items:center;\n  }\n  @media(max-width:820px){ .hero{ grid-template-columns:1fr; padding-top:36px;} }\n\n  .eyebrow{\n    font-family:var(--mono);\n    font-size:12px;\n    letter-spacing:0.15em;\n    text-transform:uppercase;\n    color:var(--stamp);\n    margin:0 0 14px;\n  }\n  .hero h1{\n    font-family:var(--display);\n    font-size:clamp(32px,4.4vw,50px);\n    line-height:1.06;\n    margin:0 0 18px;\n    letter-spacing:-0.01em;\n  }\n  .hero p.lede{\n    font-size:16px;\n    color:#3B3A33;\n    max-width:46ch;\n    margin:0 0 24px;\n  }\n  .stat-row{\n    display:flex;\n    gap:28px;\n    flex-wrap:wrap;\n  }\n  .stat b{\n    display:block;\n    font-family:var(--display);\n    font-size:28px;\n    color:var(--ink-2);\n  }\n  .stat span{\n    font-family:var(--mono);\n    font-size:11px;\n    letter-spacing:0.06em;\n    text-transform:uppercase;\n    color:var(--muted);\n  }\n\n  /* ---------- license card signature element ---------- */\n  .license-card{\n    position:relative;\n    background:var(--white);\n    border:1px solid var(--line);\n    border-radius:10px;\n    padding:22px 24px 26px;\n    box-shadow:0 14px 30px -18px rgba(16,31,56,0.35);\n    transform:rotate(1.2deg);\n    font-family:var(--mono);\n  }\n  .license-card::before{\n    content:\"\";\n    position:absolute;\n    inset:8px;\n    border:1px dashed var(--line);\n    border-radius:6px;\n    pointer-events:none;\n  }\n  .license-card .lc-top{\n    display:flex;\n    justify-content:space-between;\n    font-size:10px;\n    letter-spacing:0.1em;\n    text-transform:uppercase;\n    color:var(--muted);\n    margin-bottom:14px;\n  }\n  .license-card h3{\n    font-family:var(--display);\n    font-size:19px;\n    margin:0 0 4px;\n    color:var(--ink);\n  }\n  .license-card .lc-sub{\n    font-size:12px;\n    color:var(--muted);\n    margin-bottom:16px;\n  }\n  .lc-grid{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:10px 16px;\n    font-size:12px;\n  }\n  .lc-grid dt{color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:0.06em;}\n  .lc-grid dd{margin:2px 0 0; font-size:13px; color:var(--ink);}\n  .stamp{\n    position:absolute;\n    right:18px;\n    bottom:18px;\n    border:2.5px solid var(--closed);\n    color:var(--closed);\n    font-family:var(--display);\n    font-weight:700;\n    font-size:13px;\n    letter-spacing:0.12em;\n    padding:5px 10px;\n    border-radius:6px;\n    transform:rotate(-8deg);\n    opacity:0.85;\n  }\n\n  /* ---------- sections ---------- */\n  section{\n    max-width:1040px;\n    margin:0 auto;\n    padding:44px 24px;\n  }\n  .section-head{\n    display:flex;\n    justify-content:space-between;\n    align-items:flex-end;\n    flex-wrap:wrap;\n    gap:10px;\n    border-bottom:1px solid var(--line);\n    padding-bottom:14px;\n    margin-bottom:26px;\n  }\n  .section-head .tag{\n    font-family:var(--mono);\n    font-size:11px;\n    letter-spacing:0.12em;\n    text-transform:uppercase;\n    color:var(--stamp);\n  }\n  .section-head h2{\n    font-family:var(--display);\n    font-size:26px;\n    margin:4px 0 0;\n  }\n  .section-head p{\n    margin:0;\n    color:var(--muted);\n    font-size:13px;\n    max-width:38ch;\n  }\n\n  /* ---------- module ledger ---------- */\n  .ledger{\n    border:1px solid var(--line);\n    border-radius:10px;\n    overflow:hidden;\n    background:var(--white);\n  }\n  .ledger-row{\n    display:grid;\n    grid-template-columns:1.7fr .9fr 1fr 1fr 1fr 1.7fr;\n    gap:10px;\n    padding:13px 18px;\n    border-bottom:1px solid var(--line);\n    font-size:13.5px;\n    align-items:center;\n  }\n  .ledger-row.head{\n    background:var(--ink);\n    color:var(--paper);\n    font-family:var(--mono);\n    font-size:10.5px;\n    letter-spacing:0.08em;\n    text-transform:uppercase;\n  }\n  .ledger-row:last-child{border-bottom:none;}\n  .ledger-row:not(.head):nth-child(even){background:#FBFAF6;}\n  .mod-name{font-weight:600; color:var(--ink);}\n  .mod-date{font-family:var(--mono); color:var(--muted); font-size:12px;}\n  .chip{\n    display:inline-block;\n    padding:3px 10px;\n    border-radius:20px;\n    font-size:11px;\n    font-family:var(--mono);\n    letter-spacing:0.04em;\n    text-transform:uppercase;\n    width:fit-content;\n  }\n  .chip.on{background:#E4F0EA; color:var(--closed); border:1px solid #BFDECD;}\n  .chip.off{background:#F3E7E4; color:var(--muted); border:1px solid var(--line);}\n  .chip.pending{background:#FBF0DC; color:var(--amber); border:1px solid #EAD6A6;}\n  .mod-remark{color:var(--muted); font-size:12px;}\n\n  /* ---------- controls ---------- */\n  .controls{\n    display:flex;\n    gap:10px;\n    flex-wrap:wrap;\n    margin-bottom:20px;\n    align-items:center;\n  }\n  .controls input[type=\"search\"]{\n    flex:1 1 220px;\n    padding:10px 14px;\n    border:1px solid var(--line);\n    border-radius:8px;\n    font-family:var(--sans);\n    font-size:13px;\n    background:var(--white);\n  }\n  .filter-chip{\n    border:1px solid var(--line);\n    background:var(--white);\n    color:var(--ink-2);\n    font-family:var(--mono);\n    font-size:11px;\n    letter-spacing:0.04em;\n    text-transform:uppercase;\n    padding:7px 12px;\n    border-radius:20px;\n    cursor:pointer;\n    transition:all .15s ease;\n  }\n  .filter-chip:hover{border-color:var(--ink-2);}\n  .filter-chip.active{background:var(--ink-2); color:var(--paper); border-color:var(--ink-2);}\n  .count-note{\n    font-family:var(--mono);\n    font-size:11.5px;\n    color:var(--muted);\n    margin-bottom:16px;\n  }\n\n  /* ---------- ticket stubs ---------- */\n  .ticket{\n    position:relative;\n    background:var(--white);\n    border:1px solid var(--line);\n    border-radius:8px;\n    margin-bottom:10px;\n    overflow:hidden;\n  }\n  .ticket-head{\n    display:grid;\n    grid-template-columns:auto 1fr auto auto;\n    gap:14px;\n    align-items:center;\n    padding:13px 16px;\n    cursor:pointer;\n    font-size:13.5px;\n  }\n  .ticket-head:hover{background:#FBFAF6;}\n  .ticket-no{\n    font-family:var(--mono);\n    font-size:11px;\n    color:var(--muted);\n    background:var(--paper-2);\n    padding:3px 8px;\n    border-radius:6px;\n    white-space:nowrap;\n  }\n  .ticket-issue{font-weight:500; color:var(--ink);}\n  .ticket-date{\n    font-family:var(--mono);\n    font-size:11px;\n    color:var(--muted);\n    white-space:nowrap;\n  }\n  .ticket-type{\n    font-family:var(--mono);\n    font-size:10px;\n    text-transform:uppercase;\n    letter-spacing:0.05em;\n    padding:3px 8px;\n    border-radius:12px;\n    white-space:nowrap;\n  }\n  .ticket-type.up{background:#E4ECF3; color:var(--ink-2);}\n  .ticket-type.ts{background:#F3E7E4; color:var(--stamp);}\n  .ticket-body{\n    max-height:0;\n    overflow:hidden;\n    transition:max-height .25s ease, padding .25s ease;\n    background:#FBFAF6;\n    border-top:1px solid transparent;\n  }\n  .ticket.open .ticket-body{\n    max-height:220px;\n    padding:14px 18px 16px;\n    border-top:1px dashed var(--line);\n  }\n  .ticket-body .row{margin-bottom:8px; font-size:13px;}\n  .ticket-body .row b{\n    display:block;\n    font-family:var(--mono);\n    font-size:10px;\n    text-transform:uppercase;\n    letter-spacing:0.06em;\n    color:var(--muted);\n    margin-bottom:2px;\n  }\n  .ticket-body .delivered{\n    color:var(--closed);\n    font-weight:600;\n  }\n  .perforation{\n    position:absolute;\n    left:0; top:0; bottom:0;\n    width:6px;\n    background:repeating-linear-gradient(var(--paper),var(--paper) 6px, transparent 6px, transparent 12px);\n  }\n\n  .ticket-type.enh{background:#E4F0EA; color:var(--closed);}\n  .mix{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:28px;}\n  .mix div{background:var(--white); border:1px solid var(--line); border-radius:8px; padding:14px 16px;}\n  .mix b{display:block; font-family:var(--display); font-size:26px; color:var(--ink-2);}\n  .mix span{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted);}\n  .mix p{margin:6px 0 0; font-size:12px; color:var(--muted);}\n  @media(max-width:700px){ .mix{grid-template-columns:1fr 1fr;} }\n\n  footer{\n    max-width:1040px;\n    margin:0 auto;\n    padding:40px 24px 60px;\n    border-top:1px solid var(--line);\n    display:flex;\n    justify-content:space-between;\n    flex-wrap:wrap;\n    gap:12px;\n    font-family:var(--mono);\n    font-size:11.5px;\n    color:var(--muted);\n  }\n\n  @media(max-width:700px){\n    .ledger{overflow-x:auto;}\n    .ledger-row{min-width:800px;}\n    .ticket-head{grid-template-columns:1fr; gap:6px;}\n  }\n<\/style>\n<\/head>\n<body>\n\n  <div class=\"ledger-strip\">\n    <span>LICENSE NO. __LIC__<\/span>\n    <span>__STRIP__<\/span>\n  <\/div>\n\n  <div class=\"hero\">\n    <div>\n      <p class=\"eyebrow\">Support Engineering Case Study<\/p>\n      <h1>__H1__<\/h1>\n      <p class=\"lede\">__LEDE__<\/p>\n      <div class=\"stat-row\">\n        <div class=\"stat\"><b>__S1__<\/b><span>Modules Reviewed<\/span><\/div>\n        <div class=\"stat\"><b>__S2__<\/b><span>Modules Activated<\/span><\/div>\n        <div class=\"stat\"><b>__S3__<\/b><span>Requirements Delivered<\/span><\/div>\n        <div class=\"stat\"><b>__S4__<\/b><span>Active Since<\/span><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"license-card\">\n      <div class=\"lc-top\"><span>ERP CLIENT LICENSE<\/span><span>NO. __LIC__<\/span><\/div>\n      <h3>__SCHOOL__<\/h3>\n      <div class=\"lc-sub\">__CITYLINE__<\/div>\n      <dl class=\"lc-grid\"><dt>Installed<\/dt><dd>__INSTALLED__<\/dd><dt>Requirements<\/dt><dd>__NREQ__ delivered<\/dd><dt>Modules Live<\/dt><dd>__LIVE__<\/dd><dt>Status<\/dt><dd>Active Client<\/dd><\/dl>\n    <\/div>\n  <\/div>\n\n  <section id=\"modules\">\n    <div class=\"section-head\">\n      <div>\n        <p class=\"tag\">Part 01<\/p>\n        <h2>Module Activation Ledger<\/h2>\n      <\/div>\n      <p>What was trained, switched on, or declined &mdash; straight from the rollout log.<\/p>\n    <\/div>\n\n    <div class=\"ledger\" id=\"ledgerTable\">\n      <div class=\"ledger-row head\">\n        <div>Module<\/div>\n        <div>Training<\/div>\n        <div>Training Date<\/div>\n        <div>Activation Date<\/div>\n        <div>Activation<\/div>\n        <div>Remarks<\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"requirements\">\n    <div class=\"section-head\">\n      <div>\n        <p class=\"tag\">Part 02<\/p>\n        <h2>Delivered Requirement Tickets<\/h2>\n      <\/div>\n      <p>Every change the client asked for, and confirmed delivered &mdash; tap a ticket to open it.<\/p>\n    <\/div>\n\n    <div class=\"mix\">__MIX__<\/div>\n\n    <div class=\"controls\">\n      <input type=\"search\" id=\"searchBox\" placeholder=\"Search a requirement, ticket no., or module&hellip;\">\n      <button class=\"filter-chip active\" data-year=\"all\">All Years<\/button>__YEARS__\n    <\/div>\n    <p class=\"count-note\" id=\"countNote\"><\/p>\n    <div id=\"ticketList\"><\/div>\n  <\/section>\n\n  <footer>\n    <span>PREPARED BY __PREP__<\/span>\n    <span>SOURCE: SERVICE REPORT &amp; MODULE ACTIVATION LOGS, __RANGE__<\/span>\n  <\/footer>\n\n<script>\nconst modules = __MODULES__;\n\nconst statusLabel = {on:\"Activated\", off:\"Not Interested\", pending:\"Pending\"};\n\nconst ledger = document.getElementById(\"ledgerTable\");\nmodules.forEach(m=>{\n  const row = document.createElement(\"div\");\n  row.className = \"ledger-row\";\n  row.innerHTML = `\n    <div class=\"mod-name\">${m.name}<\/div>\n    <div><span class=\"chip ${m.train==='done'?'on':'off'}\">${m.train==='done'?'Done':'Not done'}<\/span><\/div>\n    <div class=\"mod-date\">${m.tdate}<\/div>\n    <div class=\"mod-date\">${m.date}<\/div>\n    <div><span class=\"chip ${m.status}\">${statusLabel[m.status]}<\/span><\/div>\n    <div class=\"mod-remark\">${m.remark}<\/div>`;\n  ledger.appendChild(row);\n});\n\nconst tickets = __TICKETS__;\n\nfunction renderTickets(list){\n  const wrap = document.getElementById(\"ticketList\");\n  wrap.innerHTML = \"\";\n  document.getElementById(\"countNote\").textContent = `Showing ${list.length} of ${tickets.length} delivered requirements`;\n  list.forEach(t=>{\n    const el = document.createElement(\"div\");\n    el.className = \"ticket\";\n    el.innerHTML = `\n      <div class=\"perforation\"><\/div>\n      <div class=\"ticket-head\" role=\"button\" tabindex=\"0\">\n        <span class=\"ticket-no\">#${t.no}<\/span>\n        <span class=\"ticket-issue\">${t.issue}<\/span>\n        <span class=\"ticket-type ${t.type}\">${t.label}<\/span>\n        <span class=\"ticket-date\">Delivered ${t.delivered}<\/span>\n      <\/div>\n      <div class=\"ticket-body\">\n        <div class=\"row\"><b>Raised<\/b>${t.raised}<\/div>\n        <div class=\"row\"><b>Client contact<\/b>${t.assignee}<\/div>\n        <div class=\"row\"><b>Resolution<\/b><span class=\"delivered\">${t.action}<\/span><\/div>\n      <\/div>`;\n    const head = el.querySelector(\".ticket-head\");\n    const toggle = () => el.classList.toggle(\"open\");\n    head.addEventListener(\"click\", toggle);\n    head.addEventListener(\"keypress\", e => { if(e.key === \"Enter\") toggle(); });\n    wrap.appendChild(el);\n  });\n}\n\nlet currentYear = \"all\";\nlet currentQuery = \"\";\n\nfunction applyFilters(){\n  let list = tickets;\n  if(currentYear !== \"all\"){\n    list = list.filter(t => t.delivered.endsWith(currentYear));\n  }\n  if(currentQuery){\n    const q = currentQuery.toLowerCase();\n    list = list.filter(t =>\n      t.issue.toLowerCase().includes(q) ||\n      t.no.includes(q) ||\n      t.assignee.toLowerCase().includes(q)\n    );\n  }\n  renderTickets(list);\n}\n\ndocument.querySelectorAll(\".filter-chip\").forEach(btn=>{\n  btn.addEventListener(\"click\", ()=>{\n    document.querySelectorAll(\".filter-chip\").forEach(b=>b.classList.remove(\"active\"));\n    btn.classList.add(\"active\");\n    currentYear = btn.dataset.year;\n    applyFilters();\n  });\n});\n\ndocument.getElementById(\"searchBox\").addEventListener(\"input\", e=>{\n  currentQuery = e.target.value.trim();\n  applyFilters();\n});\n\nrenderTickets(tickets);\n<\/script>\n<\/body>\n<\/html>\n";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const norm=r=>{const o={};for(const k in r)o[k.toLowerCase().replace(/[^a-z]/g,'')]=r[k];return o;};
const cap=s=>String(s).toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const yes=v=>/^(☑|✓|✔|yes|y|true|1)$/i.test(String(v==null?'':v).trim());
function toDate(v){
  if(v==null||v==='')return null;
  if(Object.prototype.toString.call(v)==='[object Date]')return isNaN(v)?null:new Date(v.getTime()+432e5);
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1],12);
  m=s.match(/^([A-Za-z]{3})[a-z]*\s+(\d{1,2})\s+(\d{4})/);
  if(m){const i=MON.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());if(i>=0)return new Date(+m[3],i,+m[2],12);}
  const d=new Date(s);return isNaN(d)?null:d;
}
const fmt=d=>d?String(d.getDate()).padStart(2,'0')+' '+MON[d.getMonth()]+' '+d.getFullYear():'—';
function contact(p){
  let s=String(p||'').trim().replace(/\s+/g,' ').replace(/\b(ma'?am|maam|mam|madam)\b/gi,"Ma'am").replace(/\bsir\b/gi,'Sir');
  s=s.split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(' ');
  return /^(Ma'am|Sir|)$/.test(s)?'—':s;
}
function suggest(t){
  const names=[...t.matchAll(/(?<![A-Za-z])["“”'‘’]\s*([A-Za-z][A-Za-z0-9_]{3,})\s*["“”'‘’]/g)].map(m=>m[1]);
  const all=names.join(' ')+' '+t;
  const label=/result\s*sheet|marksheet/i.test(all)?'Result sheet':/employee.?i-?card/i.test(all)?'Employee I-Card':/i-?card|icard|id\s*card/i.test(all)?'Student I-Card':/certificate|bonafi/i.test(all)?'Certificate':/fee.?receipt/i.test(all)?'Fee receipt':'';
  if(label&&names.length)return label+' — '+[...new Set(names)].map(n=>'“'+n+'”').join(' & ');
  let x=t.replace(/\s+/g,' ').trim().replace(/^(required?|want|need)\s+(changes?\s+)?(in|to|of)?\s*/i,'');
  x=x?x[0].toUpperCase()+x.slice(1):'Requirement';return x.length>90?x.slice(0,87)+'…':x;
}
function parseModules(rows){return rows.map(norm).filter(r=>r.module).map(r=>{
  const off=yes(r.notinterested),on=!off&&yes(r.activated),ver=yes(r.moduleactivationverified);
  const raw=String(r.module).trim();
  const name=/^vidyalaya[\s-]*sms\s*and\s*email$/i.test(raw)?'Vidyalaya – SMS & Email':raw;
  let rem=String(r.remarks||r.activationremarks||'').trim();
  if(!rem||rem.toLowerCase()===raw.toLowerCase())rem=off?'Not Interested':on?'Module Activated':'Pending';
  if(on&&!ver)rem+=' — verification pending';
  return{name:esc(name),raw,date:on||off?fmt(toDate(r.activationdate)):'—',d:toDate(r.activationdate),train:yes(r.training)?'done':'no',tdate:fmt(toDate(r.trainingdate)),status:off?'off':on?'on':'pending',remark:esc(rem)};
});}
function parseTickets(rows){
  const R=rows.map(norm).filter(r=>r.serviceno);
  let c=R.filter(r=>/closed/i.test(r.tstatus||''));if(!c.length)c=R;
  META={lic:R[0]&&R[0].licenseno,cust:R[0]&&R[0].customername,total:R.length};
  return c.map(r=>{
    const rd=toDate(r.servicedate),cd=toDate(r.closeticketdate)||rd;
    let a=String(r.actionremark||'').replace(/\s+/g,' ').replace(/what'{1,2}s ?app/ig,'WhatsApp').trim();
    a=a?a[0].toUpperCase()+a.slice(1):'Delivered to client.';if(!/[.!]$/.test(a))a+='.';
    const raw=String(r.issueremark||'').trim();
    return{no:String(r.serviceno),raw,rd,cd,contact:contact(r.inchargeperson),action:a,rc:String(r.rootcause||r.type||'Upgradation').trim(),title:suggest(raw)};
  }).sort((x,y)=>(y.cd||0)-(x.cd||0));
}
let M=null,T=null,META={},INST=null;
async function load(fs){
  for(const f of fs){
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    for(const n of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''});
      if(!rows.length)continue;const ks=Object.keys(norm(rows[0]));
      if(ks.includes('serviceno')&&ks.includes('issueremark'))T=parseTickets(rows);
      else if(ks.includes('module')&&ks.includes('activated')&&(!M||M._f!==f)){if(!M||M._f!==f){M=parseModules(rows);M._f=f;}}
    }
  }
  const fs_=$('fs');
  fs_.className=M&&T?'ok':'';
  fs_.textContent=(M?'✓ Modules: '+M.length+' rows':'✗ Module activation sheet not found')+'\n'+(T?'✓ Tickets: '+T.length+' closed (of '+META.total+')':'✗ Service-ticket export not found');
  if(M&&T)fill();
}
function fill(){
  const inst=M.find(m=>/^installation$/i.test(m.raw)&&m.status==='on')||M.filter(m=>m.status==='on'&&m.d).sort((a,b)=>a.d-b.d)[0];
  INST=inst&&inst.d||T.map(t=>t.rd).filter(Boolean).sort((a,b)=>a-b)[0]||new Date();
  const [n,...c]=String(META.cust||'').split(',');
  $('lic').value=META.lic||'';$('school').value=cap(n.trim());$('city').value=cap(c.join(',').trim());$('inst').value=fmt(INST);
  const y=Math.max(1,Math.round((Date.now()-INST)/31557600000));
  const W=['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
  $('h1').value=(W[y-1]||y)+' year'+(y>1?'s':'')+" of keeping one school's ERP running — module by module, ticket by ticket.";
  $('lede').value='Since '+MON[INST.getMonth()]+' '+INST.getFullYear()+', '+$('school').value+($('city').value?' ('+$('city').value.split(',')[0]+')':'')+' has run its daily operations on this ERP. This file tracks two things: which modules were switched on, and every requirement delivered against them since.';
  $('tt').innerHTML='';
  T.forEach(t=>{const r=document.createElement('div');r.className='tr';r.innerHTML='<span>#'+esc(t.no)+'</span><span>'+fmt(t.cd)+'</span>';
    const i=document.createElement('input');i.value=t.title;i.oninput=()=>t.title=i.value;r.appendChild(i);$('tt').appendChild(r);});
  $('ed').hidden=false;
}
function group(t){const x=t.title+' '+t.raw;
  return /result\s*sheet|marksheet/i.test(x)?'Result sheets':/i-?card|icard|id\s*card/i.test(x)?'ID cards':/certificate|bonafi/i.test(x)?'Certificates':/fee|receipt|tally|payment/i.test(x)?'Fee & Tally':/mobile|\bapp\b/i.test(x)?'Mobile app':/report/i.test(x)?'Reports':'Other changes';}
function build(){
  const v=id=>$(id).value.trim(),E=esc,j=x=>JSON.stringify(x).replace(/</g,'\\u003c');
  const on=M.filter(m=>m.status==='on').length;
  const yrs=T.map(t=>t.cd&&t.cd.getFullYear()).filter(Boolean),y0=INST.getFullYear(),y1=Math.max(y0,...yrs);
  const range=y0===y1?''+y0:y0+'–'+String(y1).slice(2);
  const tickets=T.map(t=>({no:t.no,issue:E(t.title),type:/trouble|bug|error|fix/i.test(t.rc)?'ts':/enhanc/i.test(t.rc)?'enh':'up',label:E(t.rc),raised:fmt(t.rd),delivered:fmt(t.cd),assignee:E(t.contact),action:E(t.action)}));
  const g={};T.forEach(t=>{(g[group(t)]=g[group(t)]||[]).push(t);});
  const mix=Object.entries(g).sort((a,b)=>b[1].length-a[1].length).slice(0,4).map(([k,a])=>{
    const mc={};a.forEach(t=>{if(t.rd)mc[t.rd.getMonth()]=(mc[t.rd.getMonth()]||0)+1;});
    const top=Object.entries(mc).sort((p,q)=>q[1]-p[1])[0];
    const note=top&&top[1]/a.length>=.5&&a.length>1?top[1]+' of '+a.length+' raised in '+MON[top[0]]+'.':'Delivered across the years.';
    return '<div><b>'+a.length+'</b><span>'+E(k)+'</span><p>'+note+'</p></div>';}).join('');
  const years=[...new Set(yrs)].sort().map(y=>'<button class="filter-chip" data-year="'+y+'">'+y+'</button>').join('\n      ');
  const city=v('city');let H=TEMPLATE;
  const R={__TITLE__:'',__LIC__:E(v('lic')),__SCHOOL__:E(v('school')),__STRIP__:E(v('school')).toUpperCase()+(city?', '+E(city.split(',')[0]).toUpperCase():''),
    __H1__:E(v('h1')),__LEDE__:E(v('lede')),__S1__:M.length,__S2__:on,__S3__:T.length,__S4__:range,
    __CITYLINE__:(city?E(city)+' &middot; ':'')+'Vidyalaya ERP Suite',__INSTALLED__:E(v('inst')),__NREQ__:T.length,__LIVE__:on+' of '+M.length,
    __MIX__:mix,__YEARS__:years,__PREP__:E(v('prep')),__RANGE__:y0===y1?y0:y0+'&ndash;'+y1,
    __MODULES__:j(M.map(m=>({train:m.train,tdate:m.tdate,name:m.name,date:m.date,status:m.status,remark:m.remark}))),__TICKETS__:j(tickets)};
  for(const k in R)H=H.split(k).join(R[k]);
  return H;
}
$('files').onchange=e=>load([...e.target.files]);
const dz=$('drop');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');load([...e.dataTransfer.files]);};
$('pv').onclick=()=>{const f=$('frame');f.hidden=false;f.srcdoc=build();f.scrollIntoView({behavior:'smooth'});};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([build()],{type:'text/html'}));a.download=($('lic').value.trim()||'client')+'_case_study.html';a.click();};
</script></body></html>
